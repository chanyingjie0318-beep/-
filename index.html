<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城隍六十靈籤</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",sans-serif}
        body{
            background:url('https://picsum.photos/id/1035/1920/1080') center/cover no-repeat fixed;
            min-height:100vh;
            padding:20px;
        }
        .mask{
            position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:0;
        }
        .wrap{
            position:relative;z-index:1;max-width:900px;margin:0 auto;
        }
        h1{
            text-align:center;color:#fff;font-size:32px;margin-bottom:20px;
            text-shadow:2px 2px 4px #000;
        }
        .card{
            background:rgba(90,60,30,0.85);
            border-radius:16px;padding:30px;color:#fff;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }
        .tip-text{text-align:center;font-size:18px;margin-bottom:20px;line-height:1.6}
        .jiao-box{
            background:rgba(120,80,40,0.6);
            border-radius:12px;padding:20px;text-align:center;margin-bottom:20px;font-size:20px;
        }
        .btn{
            display:block;width:220px;margin:12px auto;padding:14px 0;
            border:none;border-radius:10px;font-size:18px;cursor:pointer;transition:0.2s;
        }
        .btn-jiao{background:#d4a048;color:#222}
        .btn-jiao:hover{background:#e0b058}
        .btn-lot{background:#966c3e;color:#fff}
        .btn-lot:disabled{opacity:0.4;cursor:not-allowed}
        .divider{margin:25px 0;border-top:1px dashed #999}
        .record-tit{text-align:center;font-size:17px;margin-bottom:10px}
        .record-list{max-height:160px;overflow:auto;font-size:15px;line-height:1.7}
        .bottom-btns{margin-top:25px;display:flex;flex-direction:column;gap:12px}
        .btn-line{background:#28b860;color:#fff}
        .btn-donate{background:#c83c3c;color:#fff}
    </style>
</head>
<body>
<div class="mask"></div>
<div class="wrap">
    <h1>🏮 城隍六十靈籤</h1>
    <div class="card">
        <div class="tip-text">抽取城隍靈籤<br>誠心淨手，默念心中所求之事，擲筊請示神明後方可搖籤</div>
        <div class="jiao-box" id="jiaoShow">擲聖筊（累計 0/3 聖筊）</div>

        <button class="btn btn-jiao" id="btnJiao">擲筊</button>
        <button class="btn btn-lot" id="btnLot" disabled>搖籤求籤詩</button>

        <div class="divider"></div>
        <div class="record-tit">📜 最近抽籤紀錄</div>
        <div class="record-list" id="recordList"></div>
    </div>

    <div class="bottom-btns">
        <button class="btn btn-line">💬 線上問事 | 官方LINE</button>
        <button class="btn btn-donate">🕯️ 隨喜功德 捐棺積陰德</button>
    </div>
</div>

<script>
// 掷筊核心变量
let saintCount = 0;
const needTotal = 3;
const jiaoShow = document.getElementById('jiaoShow');
const btnJiao = document.getElementById('btnJiao');
const btnLot = document.getElementById('btnLot');
const recordList = document.getElementById('recordList');
let recordArr = JSON.parse(localStorage.getItem('lotRecord')||'[]');

// 渲染抽签记录
function renderRecord(){
    recordList.innerHTML = recordArr.map(item=>`<div>${item}</div>`).join('');
}
renderRecord();

// 掷筊逻辑
btnJiao.addEventListener('click',function(){
    const rand = Math.random();
    let resText = '';
    // 概率：圣筊35%、阴筊35%、笑筊30%
    if(rand < 0.35){
        saintCount++;
        resText = `本次：✅聖筊｜累計 ${saintCount}/${needTotal} 聖筊`;
    }else if(rand < 0.7){
        resText = `本次：❌陰筊｜累計 ${saintCount}/${needTotal} 聖筊`;
    }else{
        resText = `本次：💫笑筊｜累計 ${saintCount}/${needTotal} 聖筊`;
    }
    jiaoShow.innerText = resText;

    // 满3次解锁摇签
    if(saintCount >= needTotal){
        btnLot.disabled = false;
    }
});

// 六十灵签简易签库（示例可自行扩充）
const lotLib = [
    "第一籤 上上 枯木逢春發新芽",
    "第二籤 中平 風平浪靜穩行舟",
    "第三籤 上吉 貴人相助事事成"
];

// 摇签逻辑
btnLot.addEventListener('click',function(){
    const pick = lotLib[Math.floor(Math.random()*lotLib.length)];
    const time = new Date().toLocaleString('zh-TW');
    const oneLog = `${time}｜${pick}`;
    recordArr.unshift(oneLog);
    if(recordArr.length>10) recordArr.pop();
    localStorage.setItem('lotRecord',JSON.stringify(recordArr));
    renderRecord();
    alert(`求得：${pick}`);
    // 重置掷筊状态
    saintCount = 0;
    jiaoShow.innerText = `擲聖筊（累計 0/${needTotal} 聖筊）`;
    btnLot.disabled = true;
});
</script>
</body>
</html>
